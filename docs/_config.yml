remote_theme: just-the-docs/just-the-docs@v0.8.2
title: AI Wiki
description: A self-hosted encyclopedia of neural networks, machine learning and artificial intelligence for engineers and self-hosters.
url: "https://ObservantJaguar.github.io"
baseurl: "/AIWiki"
color_scheme: light
nav_sort: case_insensitive
back_to_top: true
last_edit_timestamp: true

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

just_the_docs:
  navigation_depth: 4

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links